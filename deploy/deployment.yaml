---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrp-service
  labels:
    app: scrp-service
    component: conflict-resolution
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scrp-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: scrp-service
        component: conflict-resolution
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: scrp-service
          image: scrp-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          args:
            - "--host=0.0.0.0"
            - "--port=50051"
            - "--workers=10"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - grpc_health_probe
                - -addr=:50051
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - grpc_health_probe
                - -addr=:50051
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: scrp-service
  labels:
    app: scrp-service
    component: conflict-resolution
spec:
  type: ClusterIP
  selector:
    app: scrp-service
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scrp-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scrp-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
