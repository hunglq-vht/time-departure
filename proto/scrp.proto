syntax = "proto3";

package scrp;

// ---------- Primitive building blocks ----------

message WaypointProto {
  string id = 1;
  double x = 2;
  double y = 3;
  double z = 4;
}

message SegmentProto {
  WaypointProto p_start = 1;
  WaypointProto p_end = 2;
  double length = 3;
  double v_min = 4;
  double v_max = 5;
}

message LaneProto {
  string id = 1;
  repeated WaypointProto waypoints = 2;
  repeated SegmentProto segments = 3;
}

// ---------- Operator flight request ----------
// Everything the operator knows: their identity, the drone they are flying
// (including its specs), the intended flight path, and the desired schedule.
// The MSD matrix is NOT included — the algorithm maintains that separately.

message OperatorFlightRequestProto {
  // Operator / drone identity
  string operator_id = 1;
  string drone_id = 2;
  // Flight path
  LaneProto lane = 3;
  repeated double v_waypoints = 4;          // velocity entering each segment
  string destination_vertiport_id = 5;
  // Schedule
  double t_des = 6;                         // desired departure time [s Unix]
  int32 priority = 7;                       // 1 | 2 | 3  (1 = highest)
  // Drone specification — submitted by the operator alongside the request
  string uav_type = 8;                      // 'A' | 'B' | 'C'
  double soc_0 = 9;                         // state of charge [0..1]
  double c_bat = 10;                        // battery capacity [Wh]
  double p_hover = 11;                      // hover power [W]
  // Optional timing overrides — 0.0 means "not provided"
  double t_takeoff = 12;
  double t_land_estimated = 13;
}

// ---------- Approved plans ----------

message WaypointTimeEntryProto {
  WaypointProto waypoint = 1;
  double time = 2;
}

message ApprovedPlanProto {
  string drone_id = 1;
  string uav_type = 2;
  LaneProto lane = 3;
  repeated double v_waypoints = 4;
  double t_land = 5;
  string pad_id = 6;
  int32 slot_index = 7;
  string status = 8;  // 'SOFT_RESERVED' | 'COMMITTED'
  double t_dep = 9;
  repeated WaypointTimeEntryProto waypoint_times = 10;
  string algorithm = 11;
  double expires_at = 12;
}

// ---------- Vertiport ----------

message PadProto {
  string id = 1;
  repeated string compatible_types = 2;
}

// Encodes one (pad_id, slot_index) → (drone_id, status) mapping entry
message SlotEntryProto {
  string pad_id = 1;
  int32 slot_index = 2;
  string drone_id = 3;   // empty string when unoccupied
  string status = 4;     // 'FREE' | 'SOFT' | 'COMMITTED'
}

message VertiportStateProto {
  string vertiport_id = 1;
  repeated PadProto pads = 2;
  double slot_duration = 3;
  repeated SlotEntryProto slots = 4;
}

// ---------- System state ----------

message MsdEntryProto {
  string uav_type_i = 1;
  string uav_type_j = 2;
  double msd = 3;
}

message BodyLengthEntryProto {
  string uav_type = 1;
  double length_m = 2;
}

// SystemStateProto excludes approved_plans and vertiport_state
// (those are passed explicitly in ResolveConflictRequest).
message SystemStateProto {
  repeated ApprovedPlanProto approved_plans = 1;
  VertiportStateProto vertiport_state = 2;
  double t_now = 3;
  repeated MsdEntryProto msd_matrix = 4;
  repeated BodyLengthEntryProto body_length = 5;
}

// ---------- Config ----------

message SCRPConfigProto {
  double soc_min = 1;
  double slot_duration_sec = 2;
  double t_response_window_sec = 3;
  double junction_diameter_m = 4;
  string default_timeout_behavior = 5;
  double cruise_power_factor = 6;
  double max_acceptable_delay_sec = 7;
}

// ---------- Results ----------

message WaypointTimeResultProto {
  string waypoint_id = 1;
  double time = 2;
}

message ApproveResultProto {
  string status = 1;             // always 'SOFT_RESERVED'
  double t_dep_star = 2;
  double t_land_assigned = 3;
  string pad_id = 4;
  int32 slot_index = 5;
  repeated WaypointTimeResultProto waypoint_times = 6;
  double expires_at = 7;
  double delay_seconds = 8;
  string delay_source = 9;
  double energy_estimate = 10;
  double soc_remaining = 11;
}

message RejectResultProto {
  string status = 1;             // always 'REJECTED'
  string reason = 2;
  double earliest_possible = 3;  // 0.0 means "not available"
  bool has_earliest_possible = 4;
  string detail = 5;
}

// ---------- RPC messages ----------

message ResolveConflictRequest {
  OperatorFlightRequestProto fi = 1;
  repeated ApprovedPlanProto approved_plans = 2;
  VertiportStateProto vertiport_state = 3;
  SystemStateProto system_state = 4;
  SCRPConfigProto config = 5;
}

message ResolveConflictResponse {
  oneof result {
    ApproveResultProto approve = 1;
    RejectResultProto reject = 2;
  }
}

// ---------- Flight route suggestion ----------

message DroneProfileProto {
  // Physical / aerodynamic
  double weight_kg = 1;
  double max_wind_resistance = 2;  // m/s; max wind the drone tolerates
  string drone_size = 3;           // 'A' | 'B' | 'C'
  double cruise_speed = 4;         // m/s; planned cruise airspeed

  // Power / energy
  double p_hover = 5;              // W; hover power
  double c_bat = 6;                // Wh; total battery capacity
  double soc_0 = 7;                // [0..1]; initial state of charge

  // Optional overrides (0.0 means use default)
  double cruise_power_factor = 8;  // P_cruise = P_hover * factor; default 1.2
  double t_takeoff_s = 9;          // s; takeoff phase duration; default 30
  double t_landing_s = 10;         // s; landing phase duration; default 30
  double soc_min = 11;             // minimum acceptable SoC on arrival; default 0.20
}

message FlightRouteProto {
  string route_id = 1;
  repeated WaypointProto waypoints = 2;
  repeated SegmentProto segments = 3;
  string take_off_vertiport_id = 4;
  string landing_vertiport_id = 5;
  double safety_score = 6;
  double average_wind_speed = 7;   // m/s average along route
  double max_drone_weight_kg = 8;
  repeated string compatible_drone_sizes = 9;
}

message RouteFlightEstimateProto {
  double cruise_time_s = 1;        // s; time flying the route segments
  double total_time_s = 2;         // s; cruise + takeoff + landing phases
  double energy_consumed_wh = 3;   // Wh; total energy across all phases
  double soc_remaining = 4;        // [0..1]; battery fraction on arrival
}

message SuggestedRouteProto {
  FlightRouteProto route = 1;
  RouteFlightEstimateProto estimate = 2;
}

message RouteSuggestionRequest {
  string take_off_vertiport_id = 1;
  string landing_vertiport_id = 2;
  DroneProfileProto drone = 3;
  double min_safety_score = 4;
  repeated FlightRouteProto available_routes = 5;
}

message RouteRejectionProto {
  FlightRouteProto route = 1;
  string reason = 2;
}

message RouteSuggestionResponse {
  repeated SuggestedRouteProto suggested_routes = 1;
  repeated RouteRejectionProto rejected_routes = 2;
}

// ---------- Service ----------

service SCRPService {
  // Compute the optimal departure time for a flight intention.
  // Returns either an approval (SOFT_RESERVED) or a rejection with reason.
  rpc ResolveConflict (ResolveConflictRequest) returns (ResolveConflictResponse);

  // Given a drone profile and vertiport endpoints, return which published
  // routes the drone is eligible to fly.
  rpc SuggestRoutes (RouteSuggestionRequest) returns (RouteSuggestionResponse);
}
